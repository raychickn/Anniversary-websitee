<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMAND | Zozo & Raychickn</title>
  <!-- Persona 5 Font Equivalents: Anton (Heavy Block), Permanent Marker (Chaotic/Handwritten), Montserrat (UI Text) -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
  
  <style>
    /* --- P5 COLOR PALETTE & VARIABLES --- */
    :root {
      --p5-red: #d50a0a;
      --p5-black: #080808;
      --p5-white: #f4f4f4;
      --p5-cyan: #00e5ff;
      --p5-magenta: #ff00ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: var(--p5-red);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden; /* Keeps it a fixed game-screen layout */
      display: flex;
      /* Dynamic P5 Background: Red with sharp black diagonal cuts and halftone */
      background-image: 
        linear-gradient(105deg, transparent 40%, var(--p5-black) 40%, var(--p5-black) 45%, transparent 45%),
        radial-gradient(circle, rgba(0,0,0,0.15) 2px, transparent 2px);
      background-size: 100% 100%, 15px 15px;
    }

    /* --- "COMMAND" RANSOM NOTE BACKGROUND GRAPHIC (From Image 2) --- */
    .bg-command {
      position: absolute;
      bottom: -20px;
      right: -20px;
      font-family: 'Permanent Marker', cursive;
      font-size: 8rem;
      color: transparent;
      -webkit-text-stroke: 3px var(--p5-black);
      transform: rotate(-10deg);
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }

    /* --- LEFT SIDE: MAIN MENU (From Image 2) --- */
    .p5-menu {
      width: 35%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 20px;
      z-index: 10;
      gap: 15px;
    }

    /* Ransom Note Menu Buttons */
    .menu-btn {
      background: none;
      border: none;
      color: var(--p5-white);
      font-family: 'Anton', sans-serif;
      font-size: 3.5rem;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
      position: relative;
      transform: skewY(-5deg) skewX(-10deg);
      transition: all 0.1s;
      /* Heavy black outline for the P5 text pop */
      text-shadow: 
        3px 3px 0 var(--p5-black), -1px -1px 0 var(--p5-black), 
        3px -1px 0 var(--p5-black), -1px 3px 0 var(--p5-black),
        6px 6px 0 rgba(0,0,0,0.4);
    }

    /* Alternating letter sizes to simulate the messy P5 font */
    .menu-btn span:nth-child(even) { font-size: 2.8rem; }
    .menu-btn span:nth-child(3n) { font-size: 4rem; }

    .menu-btn:hover, .menu-btn.active {
      color: var(--p5-black);
      text-shadow: 
        2px 2px 0 var(--p5-white), -2px -2px 0 var(--p5-white), 
        2px -2px 0 var(--p5-white), -2px 2px 0 var(--p5-white);
      transform: skewY(-5deg) skewX(-10deg) scale(1.05) translateX(20px);
    }

    /* Cyan/Magenta glitch flash on hover */
    .menu-btn:hover::after {
      content: '';
      position: absolute;
      top: 0; left: -10px; width: 110%; height: 100%;
      background: var(--p5-cyan);
      z-index: -1;
      transform: translate(-5px, 5px);
      mix-blend-mode: screen;
    }
    .menu-btn.active::after {
      background: var(--p5-white);
      mix-blend-mode: normal;
    }

    /* --- RIGHT SIDE: CONFIDANT/STATS CARD (From Image 1) --- */
    .p5-content-area {
      width: 65%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 40px;
    }

    /* Jagged White Backdrop */
    .confidant-card {
      background: var(--p5-white);
      width: 100%;
      max-width: 700px;
      height: 85vh;
      /* Polygon creates the sharp, uneven paper edges */
      clip-path: polygon(2% 1%, 98% 0%, 100% 98%, 1% 99%, 0% 50%);
      padding: 30px;
      position: relative;
      display: flex;
      flex-direction: column;
      animation: cardPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardPop {
      0% { transform: scale(0.8) rotate(5deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Black Header Bar inside Card */
    .card-header {
      background: var(--p5-black);
      color: var(--p5-white);
      padding: 10px 20px;
      transform: skewX(-15deg);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0 var(--p5-red);
    }

    .card-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.8rem;
      margin: 0;
      transform: skewX(15deg); /* Reverses skew for text readability */
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .rank-stars {
      color: var(--p5-white);
      font-size: 1.5rem;
      transform: skewX(15deg);
    }

    /* Dynamic Content Layout */
    .inner-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
    }
    
    /* Scrollbar styling for P5 theme */
    .inner-content::-webkit-scrollbar { width: 8px; }
    .inner-content::-webkit-scrollbar-thumb { background: var(--p5-black); }

    /* Photo Grid inside Card */
    .p5-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .p5-photo {
      background: var(--p5-black);
      padding: 6px;
      position: relative;
      transform: rotate(2deg);
      transition: transform 0.2s;
      cursor: pointer;
    }
    
    .p5-photo:nth-child(even) { transform: rotate(-1deg); }
    .p5-photo:hover { transform: scale(1.05) rotate(0); z-index: 5; box-shadow: 0 0 15px var(--p5-cyan); }

    .p5-photo img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      filter: contrast(120%) grayscale(20%); /* Gritty game filter */
    }

    .p5-photo p {
      font-family: 'Permanent Marker', cursive;
      color: var(--p5-white);
      text-align: center;
      margin: 5px 0 0 0;
      font-size: 1.1rem;
    }

    /* Audio Play Button (Styled like a P5 Action Prompt) */
    .play-btn {
      background: var(--p5-red);
      color: var(--p5-white);
      border: 3px solid var(--p5-black);
      font-family: 'Anton', sans-serif;
      font-size: 1.5rem;
      padding: 5px 20px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transform: skewX(-10deg);
      box-shadow: 4px 4px 0 var(--p5-black);
      transition: all 0.1s;
      margin-bottom: 15px;
    }
    .play-btn:active { transform: skewX(-10deg) translate(2px, 2px); box-shadow: 2px 2px 0 var(--p5-black); }

    /* Bottom Right "COMMAND" visual flair */
    .corner-flair {
      position: absolute;
      bottom: -15px;
      right: -10px;
      font-family: 'Permanent Marker', cursive;
      font-size: 3rem;
      color: var(--p5-black);
      transform: rotate(-15deg);
      text-shadow: 2px 2px 0 var(--p5-white);
    }
  </style>
</head>
<body>

  <!-- HUGE BACKGROUND TEXT -->
  <div class="bg-command">COMMAND</div>

  <!-- HIDDEN AUDIO TRACKS -->
  <audio id="song_y1" src="song_year1.mp3"></audio>
  <audio id="song_y2" src="song_year2.mp3"></audio>
  <audio id="song_y3" src="song_year3.mp3"></audio>

  <!-- LEFT MENU: RANSOM NOTE STYLE -->
  <nav class="p5-menu">
    <button class="menu-btn active" onclick="loadData('y1', this)">
      <span>Y</span>e<span>A</span>r <span>1</span>
    </button>
    <button class="menu-btn" onclick="loadData('y2', this)">
      <span>Y</span>e<span>A</span>r <span>2</span>
    </button>
    <button class="menu-btn" onclick="loadData('y3', this)">
      <span>Y</span>e<span>A</span>r <span>3</span>
    </button>
    <button class="menu-btn" onclick="loadData('y4', this)">
      <span>Y</span>e<span>A</span>r <span>4</span>
    </button>
    <button class="menu-btn" onclick="loadData('y5', this)">
      <span>Y</span>e<span>A</span>r <span>5</span>
    </button>
  </nav>

  <!-- RIGHT CONTENT: CONFIDANT CARD -->
  <main class="p5-content-area">
    <div class="confidant-card" id="card-display">
      
      <!-- DEFAULT LOADED CONTENT (YEAR 1) -->
      <div class="card-header">
        <h2>CONFIDANT RANK: 1</h2>
        <div class="rank-stars">★☆☆☆☆</div>
      </div>
      
      <div class="inner-content">
        <button class="play-btn" onclick="toggleAudio('song_y1', this)">▶ Play BGM</button>
        <p style="font-weight: 900; font-size: 1.1rem; margin-top:0;">2021-2022: THE AWAKENING.</p>
        <p>Where our story began. The first time our worlds collided.</p>
        
        <div class="p5-gallery">
          <div class="p5-photo">
            <img src="IMG_9733.jpeg" alt="Drink">
            <p>FIRST DRINK</p>
          </div>
          <div class="p5-photo">
            <img src="IMG_2467.jpeg" alt="House">
            <p>FIRST VISIT</p>
          </div>
        </div>
      </div>
      
      <div class="corner-flair">MEMORIES</div>
    </div>
  </main>

  <script>
    // --- DATABASE OF YOUR YEARS & PHOTOS ---
    const gameData = {
      'y1': {
        rank: "1", stars: "★☆☆☆☆", song: "song_y1",
        title: "2021-2022: THE AWAKENING.",
        desc: "Where our story began. The first time our worlds collided.",
        photos: [
          { src: "IMG_9733.jpeg", cap: "FIRST DRINK" },
          { src: "IMG_2467.jpeg", cap: "FIRST VISIT" }
        ]
      },
      'y2': {
        rank: "2", stars: "★★☆☆☆", song: "song_y2",
        title: "2022-2023: EXPANDING HORIZONS.",
        desc: "Growing closer. Taking on palaces together.",
        photos: [
          { src: "IMG_5759.jpeg", cap: "GOTH x DREADHEAD" }
        ]
      },
      'y3': {
        rank: "3", stars: "★★★☆☆", song: "song_y3",
        title: "2023-2024: UNBREAKABLE BOND.",
        desc: "Our favorite routines and holiday trips.",
        photos: [
          { src: "IMG_5218.jpeg", cap: "FIRST HOLIDAY" }
        ]
      },
      'y4': {
        rank: "4", stars: "★★★★☆", song: "song_y4", // Assumes you upload song_y4.mp3
        title: "2024-2025: ROAD TRIP ARC.",
        desc: "Unforgettable memories and endless laughs.",
        photos: [
          { src: "DSC_0071 2.jpeg", cap: "PROM ROYALS" }
        ]
      },
      'y5': {
        rank: "MAX", stars: "★★★★★", song: "song_y5", // Assumes you upload song_y5.mp3
        title: "2025-2026: HALF A DECADE.",
        desc: "5 whole years. Our Confidant Rank is officially MAXED OUT.",
        photos: [
          { src: "IMG_1850 2.jpeg", cap: "HALLOWEEN" }
        ]
      }
    };

    let currentAudio = null;

    // --- SWAP OUT THE CARD CONTENT DYNAMICALLY ---
    function loadData(yearId, btnElement) {
      // 1. Update Menu Highlights
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // 2. Fetch data for clicked year
      const data = gameData[yearId];

      // 3. Generate the photo HTML dynamically
      let photoHTML = '';
      data.photos.forEach(img => {
        photoHTML += `
          <div class="p5-photo">
            <img src="${img.src}" alt="${img.cap}">
            <p>${img.cap}</p>
          </div>
        `;
      });

      // 4. Inject the new HTML into the jagged card
      const display = document.getElementById('card-display');
      
      // Temporarily remove animation class to re-trigger it
      display.style.animation = 'none';
      display.offsetHeight; // trigger reflow
      display.style.animation = null; 

      display.innerHTML = `
        <div class="card-header">
          <h2>CONFIDANT RANK: ${data.rank}</h2>
          <div class="rank-stars">${data.stars}</div>
        </div>
        
        <div class="inner-content">
          <button class="play-btn" onclick="toggleAudio('${data.song}', this)">▶ Play BGM</button>
          <p style="font-weight: 900; font-size: 1.1rem; margin-top:0;">${data.title}</p>
          <p>${data.desc}</p>
          
          <div class="p5-gallery">
            ${photoHTML}
          </div>
        </div>
        
        <div class="corner-flair">MEMORIES</div>
      `;
    }

    // --- AUDIO CONTROL ---
    function toggleAudio(audioId, btnElement) {
      const track = document.getElementById(audioId);
      
      if (!track) {
        alert("Upload " + audioId + ".mp3 to GitHub first!");
        return;
      }

      // Pause previously playing track
      if (currentAudio && currentAudio !== track) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      if (track.paused) {
        track.play();
        btnElement.innerText = "⏸ PAUSE BGM";
        currentAudio = track;
      } else {
        track.pause();
        btnElement.innerText = "▶ PLAY BGM";
      }
    }
  </script>
</body>
</html>
