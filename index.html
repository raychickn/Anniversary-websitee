<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autumn Scrapbook | Zozo & Raychickn</title>
  <!-- Google Fonts: Playfair Display (Serif headers) + Caveat (Handwritten text) + Montserrat (UI text) -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       AUTUMN SCRAPBOOK COLOR PALETTE & VARIABLES
       ========================================== */
    :root {
      --autumn-bg: #f8f1e5;        /* Warm cream/beige paper background */
      --autumn-terracotta: #c85a32;/* Deep warm rust/terracotta */
      --autumn-amber: #e09f3e;     /* Golden amber */
      --autumn-brown: #4a332a;     /* Rich dark brown text */
      --autumn-leaf: #9e2a2b;      /* Deep autumn leaf red */
      --tape-color: rgba(224, 159, 62, 0.45); /* Golden Washi tape */
      --paper-white: #fffdf9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: var(--autumn-bg);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: var(--autumn-brown);
      user-select: none;
      /* Soft paper dot texture background */
      background-image: radial-gradient(#d8c7b5 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }

    /* Floating Autumn Leaves Graphic Accents */
    .leaf-decor {
      position: absolute;
      font-size: 2.5rem;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
      animation: floatLeaf 4s ease-in-out infinite alternate;
    }

    @keyframes floatLeaf {
      from { transform: translateY(0px) rotate(0deg); }
      to { transform: translateY(-15px) rotate(10deg); }
    }

    /* ==========================================
       HEADER LOGO
       ========================================== */
    .header-logo {
      position: absolute;
      top: 25px;
      left: 35px;
      z-index: 10;
      transform: skewX(-6deg) rotate(-2deg);
    }

    .header-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      color: var(--autumn-terracotta);
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0px #edd8c4;
    }

    .header-logo span {
      font-family: 'Caveat', cursive;
      color: var(--autumn-leaf);
      font-size: 3.5rem;
    }

    /* ==========================================
       SLANTED SCRAPBOOK MENU (LEFT SIDE)
       ========================================== */
    .p3-menu {
      position: absolute;
      top: 140px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .menu-item {
      background: var(--paper-white);
      color: var(--autumn-brown);
      border: 3px solid var(--autumn-terracotta);
      padding: 12px 25px;
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      font-weight: 700;
      cursor: pointer;
      transform: skewX(-14deg);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      box-shadow: 5px 5px 0px var(--autumn-amber);
      width: 250px;
      border-radius: 6px;
    }

    .menu-item:hover, .menu-item.active {
      color: var(--paper-white);
      background: var(--autumn-terracotta);
      border-color: var(--autumn-brown);
      transform: skewX(-14deg) scale(1.08) translateX(15px);
      box-shadow: 8px 8px 0px var(--autumn-leaf);
    }

    /* ==========================================
       CENTRAL SCRAPBOOK CARD (P3-STYLE TRANSITIONS)
       ========================================== */
    .content-area {
      position: absolute;
      top: 120px;
      left: 310px;
      width: 65vw;
      max-width: 850px;
      height: 76vh;
      z-index: 10;
    }

    .scrapbook-card {
      background: var(--paper-white);
      border: 3px dashed var(--autumn-terracotta);
      padding: 30px;
      height: 100%;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(74, 51, 42, 0.1);
      overflow-y: auto;
      position: relative;
      animation: p3SlideIn 0.35s ease-out;
    }

    /* Washi tape on top of the card */
    .scrapbook-card::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      width: 130px;
      height: 26px;
      background: var(--tape-color);
      border-radius: 4px;
    }

    @keyframes p3SlideIn {
      from { opacity: 0; transform: skewX(-4deg) translateX(-30px); }
      to { opacity: 1; transform: skewX(0deg) translateX(0); }
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--autumn-terracotta);
      margin-top: 0;
      border-bottom: 2px wavy var(--autumn-amber);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chapter-badge {
      font-family: 'Caveat', cursive;
      background: var(--autumn-amber);
      color: var(--paper-white);
      font-size: 1.4rem;
      padding: 2px 14px;
      border-radius: 20px;
    }

    /* POLAROID PHOTO GRID INSIDE CARDS */
    .polaroid-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .polaroid {
      background: #ffffff;
      padding: 10px 10px 20px 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      transform: rotate(-2deg);
      border: 1px solid #f0ebe1;
      border-radius: 6px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .polaroid:nth-child(even) { transform: rotate(2deg); }

    .polaroid:hover {
      transform: scale(1.05) rotate(0deg);
      box-shadow: 0 10px 25px rgba(200, 90, 50, 0.2);
      z-index: 5;
    }

    .polaroid img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #eee;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--autumn-brown);
      margin-top: 8px;
      margin-bottom: 0;
    }

    /* Small tape on polaroids */
    .polaroid::before {
      content: '';
      position: absolute;
      top: -8px; left: 35%;
      width: 30%; height: 14px;
      background: var(--tape-color);
    }

    /* AUDIO CONTROLLER BUTTON */
    .audio-btn {
      position: absolute;
      bottom: 25px;
      left: 35px;
      background: var(--autumn-amber);
      color: var(--paper-white);
      border: none;
      padding: 10px 22px;
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 25px;
      box-shadow: 0 4px 12px rgba(224, 159, 62, 0.4);
      z-index: 100;
      transition: transform 0.2s;
    }

    .audio-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- BACKGROUND MUSIC -->
  <audio id="bgm" loop src="autumn_music.mp3"></audio>

  <!-- FLOATING DECORATIONS -->
  <div class="leaf-decor" style="top: 15px; right: 5vw;">🍁</div>
  <div class="leaf-decor" style="bottom: 40px; right: 3vw; animation-delay: 1s;">🍂</div>

  <!-- AUDIO CONTROLLER -->
  <button class="audio-btn" onclick="toggleMusic()" id="musicBtn">🎵 Play Autumn BGM</button>

  <!-- HEADER TITLE -->
  <div class="header-logo">
    <h1>Zozo & Raychickn <span>Scrapbook</span></h1>
  </div>

  <!-- SLANTED NAVIGATION MENU (P3 TRANSITION MECHANIC) -->
  <nav class="p3-menu">
    <button class="menu-item active" onclick="switchTab('y1', this)">Year 1 (2021-22)</button>
    <button class="menu-item" onclick="switchTab('y2', this)">Year 2 (2022-23)</button>
    <button class="menu-item" onclick="switchTab('y3', this)">Year 3 (2023-24)</button>
    <button class="menu-item" onclick="switchTab('y4', this)">Year 4 (2024-25)</button>
    <button class="menu-item" onclick="switchTab('y5', this)">Year 5 (2025-26)</button>
  </nav>

  <!-- CENTRAL SCRAPBOOK CARD -->
  <main class="content-area">
    <div class="scrapbook-card" id="displayCard">
      <!-- DEFAULT CONTENT (YEAR 1) -->
      <h2 class="card-title">
        Chapter 1: The Awakening 🍂
        <span class="chapter-badge">2021 – 2022</span>
      </h2>
      <p style="font-size: 1.1rem; line-height: 1.6;">
        Where our story first began. Exploring new places, making memories, and starting our journey together.
      </p>

      <div class="polaroid-grid">
        <div class="polaroid">
          <img src="IMG_9733.jpeg" alt="Our First Drink">
          <p class="polaroid-caption">Our First Drink 🍹</p>
        </div>
        <div class="polaroid">
          <img src="IMG_2467.jpeg" alt="First Time Coming Over">
          <p class="polaroid-caption">First Time Coming Over 🏠</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    // DATA STORE FOR YOUR YEARS & PHOTOS
    const yearData = {
      'y1': `
        <h2 class="card-title">
          Chapter 1: The Awakening 🍂
          <span class="chapter-badge">2021 – 2022</span>
        </h2>
        <p style="font-size: 1.1rem; line-height: 1.6;">
          Where our story first began. Exploring new places, making memories, and starting our journey together.
        </p>
        <div class="polaroid-grid">
          <div class="polaroid">
            <img src="IMG_9733.jpeg" alt="Our First Drink">
            <p class="polaroid-caption">Our First Drink 🍹</p>
          </div>
          <div class="polaroid">
            <img src="IMG_2467.jpeg" alt="First Time Coming Over">
            <p class="polaroid-caption">First Time Coming Over 🏠</p>
          </div>
        </div>
      `,
      'y2': `
        <h2 class="card-title">
          Chapter 2: Growing Closer 🍁
          <span class="chapter-badge">2022 – 2023</span>
        </h2>
        <p style="font-size: 1.1rem; line-height: 1.6;">
          Building memories, finding our favorite spots, and growing closer every day.
        </p>
        <div class="polaroid-grid">
          <div class="polaroid">
            <img src="IMG_5759.jpeg" alt="Goth x Dreadhead">
            <p class="polaroid-caption">Goth x Dreadhead 🖤</p>
          </div>
        </div>
      `,
      'y3': `
        <h2 class="card-title">
          Chapter 3: Routines & Trips ☕
          <span class="chapter-badge">2023 – 2024</span>
        </h2>
        <p style="font-size: 1.1rem; line-height: 1.6;">
          Cozy routines, holiday trips, and celebrating every small milestone.
        </p>
        <div class="polaroid-grid">
          <div class="polaroid">
            <img src="IMG_5218.jpeg" alt="Our First Holiday">
            <p class="polaroid-caption">Our First Holiday ✈️</p>
          </div>
        </div>
      `,
      'y4': `
        <h2 class="card-title">
          Chapter 4: Adventures 🎃
          <span class="chapter-badge">2024 – 2025</span>
        </h2>
        <p style="font-size: 1.1rem; line-height: 1.6;">
          Road trips, endless laughs, and special occasions.
        </p>
        <div class="polaroid-grid">
          <div class="polaroid">
            <img src="DSC_0071 2.jpeg" alt="Prom King & Queen">
            <p class="polaroid-caption">Prom King & Queen 👑</p>
          </div>
        </div>
      `,
      'y5': `
        <h2 class="card-title">
          Chapter 5: Half a Decade 🎉
          <span class="chapter-badge">2025 – 2026</span>
        </h2>
        <p style="font-size: 1.1rem; line-height: 1.6;">
          Celebrating 5 whole years together—and so many more chapters to come!
        </p>
        <div class="polaroid-grid">
          <div class="polaroid">
            <img src="IMG_1850 2.jpeg" alt="Halloween">
            <p class="polaroid-caption">Halloween 🎃</p>
          </div>
        </div>
      `
    };

    // DYNAMIC P3-STYLE TRANSITION LOGIC
    function switchTab(tabKey, btn) {
      document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const card = document.getElementById('displayCard');
      // Reset animation class to re-trigger slide-in
      card.style.animation = 'none';
      card.offsetHeight; // trigger reflow
      card.style.animation = 'p3SlideIn 0.35s ease-out';

      card.innerHTML = yearData[tabKey];
    }

    // AUDIO PLAYBACK
    function toggleMusic() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('musicBtn');

      if (audio.paused) {
        audio.play().catch(e => console.log("Audio waiting for user click"));
        btn.innerText = "⏸ Pause BGM";
        btn.style.background = "#c85a32";
      } else {
        audio.pause();
        btn.innerText = "🎵 Play Autumn BGM";
        btn.style.background = "#e09f3e";
      }
    }
  </script>
</body>
</html>
