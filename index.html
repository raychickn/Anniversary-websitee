<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAKE YOUR HEART | Zozo & Raychickn</title>
  <!-- Authentic P5 Typography Styles via Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --p5-red: #d50a0a;
      --p5-black: #080808;
      --p5-white: #f4f4f4;
      --p5-yellow: #fff200;
      --p5-cyan: #00e5ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      height: 100vh;
      background-color: var(--p5-red);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      display: flex;
      background-image: 
        linear-gradient(105deg, transparent 40%, var(--p5-black) 40%, var(--p5-black) 45%, transparent 45%),
        radial-gradient(circle, rgba(0,0,0,0.2) 2px, transparent 2px);
      background-size: 100% 100%, 14px 14px;
    }

    /* =========================================================
       1. CALLING CARD INTRO OVERLAY
       ========================================================= */
    #calling-card-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(8, 8, 8, 0.94);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .card-container {
      width: 360px;
      height: 230px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card-container.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      border: 4px solid var(--p5-black);
      box-shadow: 10px 10px 0 var(--p5-white), 16px 16px 0 var(--p5-black);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      text-align: center;
    }

    /* CARD FRONT: AUTHENTIC PHANTOM THIEVES LOGO */
    .card-front {
      background: var(--p5-red);
      background-image: 
        radial-gradient(circle, var(--p5-black) 18%, transparent 19%),
        radial-gradient(circle, var(--p5-red) 38%, transparent 39%);
      background-size: 70px 70px;
      transform: rotate(-3deg);
    }

    /* SVG Mask Logo Styling */
    .p5-logo-svg {
      width: 130px;
      height: auto;
      filter: drop-shadow(4px 4px 0px var(--p5-black));
    }

    .tyh-text {
      font-family: 'Permanent Marker', cursive;
      font-size: 1.6rem;
      background: var(--p5-black);
      color: var(--p5-white);
      padding: 3px 12px;
      transform: skewX(-12deg) rotate(-2deg);
      box-shadow: 3px 3px 0 var(--p5-yellow);
      margin-top: 8px;
    }

    .click-prompt {
      position: absolute;
      bottom: -40px;
      font-family: 'Anton', sans-serif;
      font-size: 1.1rem;
      color: var(--p5-yellow);
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--p5-black);
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

    /* CARD BACK: EXACT P5 RANSOM NOTE STYLING */
    .card-back {
      background: var(--p5-red);
      transform: rotateY(180deg) rotate(2deg);
    }

    .p5-ransom-note {
      background: var(--p5-black);
      border: 3px solid var(--p5-white);
      padding: 15px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform: skew(-2deg);
      box-shadow: 6px 6px 0 var(--p5-yellow);
    }

    /* Staggered Cut-Out Ransom Font Blocks */
    .ransom-line {
      font-family: 'Anton', sans-serif;
      text-transform: uppercase;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      margin: 2px 0;
    }

    .ransom-char {
      display: inline-block;
      padding: 1px 6px;
      font-size: 1.2rem;
      line-height: 1.2;
    }

    /* Alternating P5 Ransom Colors & Rotations */
    .ransom-char:nth-child(odd) { background: var(--p5-white); color: var(--p5-black); transform: rotate(-3deg); }
    .ransom-char:nth-child(even) { background: var(--p5-red); color: var(--p5-white); transform: rotate(4deg); font-size: 1.3rem; }
    .ransom-char:nth-child(3n) { background: var(--p5-yellow); color: var(--p5-black); transform: rotate(-2deg); }

    #enter-btn {
      opacity: 0;
      pointer-events: none;
      margin-top: 50px;
      background: var(--p5-yellow);
      color: var(--p5-black);
      border: 4px solid var(--p5-black);
      font-family: 'Anton', sans-serif;
      font-size: 2rem;
      padding: 8px 35px;
      cursor: pointer;
      transform: skewX(-12deg);
      box-shadow: 6px 6px 0 var(--p5-white);
      transition: all 0.3s ease;
    }

    #enter-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================================================
       2. MAIN WEBSITE INTERFACE
       ========================================================= */
    .bg-command {
      position: absolute; bottom: -20px; right: -20px;
      font-family: 'Permanent Marker', cursive; font-size: 8rem;
      color: transparent; -webkit-text-stroke: 3px var(--p5-black);
      transform: rotate(-10deg); opacity: 0.15; z-index: 0; pointer-events: none;
    }

    .p5-menu {
      width: 35%; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      padding-left: 20px; z-index: 10; gap: 15px;
    }

    .menu-btn {
      background: none; border: none; color: var(--p5-white);
      font-family: 'Anton', sans-serif; font-size: 3.5rem;
      text-transform: uppercase; text-align: left; cursor: pointer;
      transform: skewY(-5deg) skewX(-10deg); transition: all 0.1s;
      text-shadow: 3px 3px 0 var(--p5-black), -1px -1px 0 var(--p5-black), 
                   3px -1px 0 var(--p5-black), -1px 3px 0 var(--p5-black),
                   6px 6px 0 rgba(0,0,0,0.4);
    }

    .menu-btn span:nth-child(even) { font-size: 2.8rem; }
    .menu-btn span:nth-child(3n) { font-size: 4rem; }

    .menu-btn:hover, .menu-btn.active {
      color: var(--p5-black);
      text-shadow: 2px 2px 0 var(--p5-white), -2px -2px 0 var(--p5-white), 
                   2px -2px 0 var(--p5-white), -2px 2px 0 var(--p5-white);
      transform: skewY(-5deg) skewX(-10deg) scale(1.05) translateX(20px);
    }

    .menu-btn.active::after {
      content: ''; position: absolute; top: 0; left: -10px; width: 110%; height: 100%;
      background: var(--p5-white); z-index: -1; transform: translate(-5px, 5px);
    }

    .p5-content-area {
      width: 65%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; padding: 40px;
    }

    .confidant-card {
      background: var(--p5-white); width: 100%; max-width: 700px; height: 85vh;
      clip-path: polygon(2% 1%, 98% 0%, 100% 98%, 1% 99%, 0% 50%);
      padding: 30px; position: relative; display: flex; flex-direction: column;
      animation: cardPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardPop {
      0% { transform: scale(0.8) rotate(5deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .card-header {
      background: var(--p5-black); color: var(--p5-white);
      padding: 10px 20px; transform: skewX(-15deg); margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 4px 4px 0 var(--p5-red);
    }

    .card-header h2 {
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic;
      font-size: 1.8rem; margin: 0; transform: skewX(15deg); text-transform: uppercase; letter-spacing: 2px;
    }

    .rank-stars { color: var(--p5-white); font-size: 1.5rem; transform: skewX(15deg); }
    .inner-content { flex: 1; overflow-y: auto; padding-right: 10px; }

    .p5-gallery {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px;
    }

    .p5-photo {
      background: var(--p5-black); padding: 6px; position: relative;
      transform: rotate(2deg); transition: transform 0.2s; cursor: pointer;
    }
    .p5-photo:nth-child(even) { transform: rotate(-1deg); }
    .p5-photo:hover { transform: scale(1.05) rotate(0); z-index: 5; box-shadow: 0 0 15px var(--p5-cyan); }

    .p5-photo img {
      width: 100%; height: 140px; object-fit: cover; filter: contrast(120%) grayscale(20%);
    }

    .p5-photo p {
      font-family: 'Permanent Marker', cursive; color: var(--p5-white);
      text-align: center; margin: 5px 0 0 0; font-size: 1.1rem;
    }

    .play-btn {
      background: var(--p5-red); color: var(--p5-white); border: 3px solid var(--p5-black);
      font-family: 'Anton', sans-serif; font-size: 1.5rem; padding: 5px 20px; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px; transform: skewX(-10deg);
      box-shadow: 4px 4px 0 var(--p5-black); transition: all 0.1s; margin-bottom: 15px;
    }

    .corner-flair {
      position: absolute; bottom: -15px; right: -10px;
      font-family: 'Permanent Marker', cursive; font-size: 3rem; color: var(--p5-black);
      transform: rotate(-15deg); text-shadow: 2px 2px 0 var(--p5-white);
    }
  </style>
</head>
<body>

  <!-- 1. CALLING CARD INTRO OVERLAY -->
  <div id="calling-card-overlay">
    <div class="card-container" id="callingCard" onclick="flipCard()">
      
      <!-- FRONT OF CARD: AUTHENTIC PHANTOM THIEVES MASK SVG -->
      <div class="card-face card-front">
        <svg class="p5-logo-svg" viewBox="0 0 500 300" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M250 20C180 20 100 70 30 110C20 115 10 130 20 140C50 170 120 220 200 240C230 248 270 248 300 240C380 220 450 170 480 140C490 130 480 115 470 110C400 70 320 20 250 20Z" fill="white" stroke="black" stroke-width="12"/>
          <path d="M160 110C120 110 80 130 60 150C90 170 140 180 180 160C190 155 180 120 160 110Z" fill="black"/>
          <path d="M340 110C380 110 420 130 440 150C410 170 360 180 320 160C310 155 320 120 340 110Z" fill="black"/>
          <path d="M250 40C220 70 180 90 130 100C180 120 220 150 250 210C280 150 320 120 370 100C320 90 280 70 250 40Z" fill="red"/>
        </svg>
        <div class="tyh-text">TAKE YOUR HEART</div>
        <div class="click-prompt">▼ CLICK TO OPEN ▼</div>
      </div>

      <!-- BACK OF CARD: RANSOM NOTE TYPOGRAPHY -->
      <div class="card-face card-back">
        <div class="p5-ransom-note">
          <div class="ransom-line">
            <span class="ransom-char">S</span><span class="ransom-char">I</span><span class="ransom-char">R</span>
            <span class="ransom-char">Z</span><span class="ransom-char">O</span><span class="ransom-char">Z</span><span class="ransom-char">O</span>
          </div>
          <div class="ransom-line">
            <span class="ransom-char">Y</span><span class="ransom-char">O</span><span class="ransom-char">U</span><span class="ransom-char">R</span>
            <span class="ransom-char">H</span><span class="ransom-char">E</span><span class="ransom-char">A</span><span class="ransom-char">R</span><span class="ransom-char">T</span>
          </div>
          <div class="ransom-line">
            <span class="ransom-char">H</span><span class="ransom-char">A</span><span class="ransom-char">S</span>
            <span class="ransom-char">B</span><span class="ransom-char">E</span><span class="ransom-char">E</span><span class="ransom-char">N</span>
          </div>
          <div class="ransom-line">
            <span class="ransom-char">S</span><span class="ransom-char">T</span><span class="ransom-char">O</span><span class="ransom-char">L</span><span class="ransom-char">E</span><span class="ransom-char">N</span>!
          </div>
        </div>
      </div>

    </div>

    <button id="enter-btn" onclick="enterPalace()">▶ ENTER PALACE</button>
  </div>

  <!-- 2. MAIN WEBSITE INTERFACE -->
  <div class="bg-command">COMMAND</div>

  <audio id="song_y1" src="song_year1.mp3"></audio>
  <audio id="song_y2" src="song_year2.mp3"></audio>

  <nav class="p5-menu">
    <button class="menu-btn active" onclick="loadData('y1', this)">
      <span>Y</span>e<span>A</span>r <span>1</span>
    </button>
    <button class="menu-btn" onclick="loadData('y2', this)">
      <span>Y</span>e<span>A</span>r <span>2</span>
    </button>
    <button class="menu-btn" onclick="loadData('y3', this)">
      <span>Y</span>e<span>A</span>r <span>3</span>
    </button>
    <button class="menu-btn" onclick="loadData('y4', this)">
      <span>Y</span>e<span>A</span>r <span>4</span>
    </button>
    <button class="menu-btn" onclick="loadData('y5', this)">
      <span>Y</span>e<span>A</span>r <span>5</span>
    </button>
  </nav>

  <main class="p5-content-area">
    <div class="confidant-card" id="card-display">
      <div class="card-header">
        <h2>CONFIDANT RANK: 1</h2>
        <div class="rank-stars">★☆☆☆☆</div>
      </div>
      
      <div class="inner-content">
        <button class="play-btn" onclick="toggleAudio('song_y1', this)">▶ Play BGM</button>
        <p style="font-weight: 900; font-size: 1.1rem; margin-top:0;">2021-2022: THE AWAKENING.</p>
        <p>Where our story began. The first time our worlds collided.</p>
        
        <div class="p5-gallery">
          <div class="p5-photo">
            <img src="IMG_9733.jpeg" alt="Drink">
            <p>FIRST DRINK</p>
          </div>
          <div class="p5-photo">
            <img src="IMG_2467.jpeg" alt="House">
            <p>FIRST VISIT</p>
          </div>
        </div>
      </div>
      
      <div class="corner-flair">MEMORIES</div>
    </div>
  </main>

  <script>
    let cardFlipped = false;

    function flipCard() {
      if (!cardFlipped) {
        document.getElementById('callingCard').classList.add('flipped');
        document.getElementById('enter-btn').classList.add('visible');
        cardFlipped = true;
      }
    }

    function enterPalace() {
      const overlay = document.getElementById('calling-card-overlay');
      overlay.style.transform = 'translateY(-100vh)';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 600);
    }

    const gameData = {
      'y1': {
        rank: "1", stars: "★☆☆☆☆", song: "song_y1",
        title: "2021-2022: THE AWAKENING.",
        desc: "Where our story began. The first time our worlds collided.",
        photos: [
          { src: "IMG_9733.jpeg", cap: "FIRST DRINK" },
          { src: "IMG_2467.jpeg", cap: "FIRST VISIT" }
        ]
      },
      'y2': {
        rank: "2", stars: "★★☆☆☆", song: "song_y2",
        title: "2022-2023: EXPANDING HORIZONS.",
        desc: "Growing closer. Taking on palaces together.",
        photos: [
          { src: "IMG_5759.jpeg", cap: "GOTH x DREADHEAD" }
        ]
      },
      'y3': {
        rank: "3", stars: "★★★☆☆", song: "song_y3",
        title: "2023-2024: UNBREAKABLE BOND.",
        desc: "Our favorite routines and holiday trips.",
        photos: [
          { src: "IMG_5218.jpeg", cap: "FIRST HOLIDAY" }
        ]
      },
      'y4': {
        rank: "4", stars: "★★★★☆", song: "song_y4",
        title: "2024-2025: ROAD TRIP ARC.",
        desc: "Unforgettable memories and endless laughs.",
        photos: [
          { src: "DSC_0071 2.jpeg", cap: "PROM ROYALS" }
        ]
      },
      'y5': {
        rank: "MAX", stars: "★★★★★", song: "song_y5",
        title: "2025-2026: HALF A DECADE.",
        desc: "5 whole years. Our Confidant Rank is officially MAXED OUT.",
        photos: [
          { src: "IMG_1850 2.jpeg", cap: "HALLOWEEN" }
        ]
      }
    };

    let currentAudio = null;

    function loadData(yearId, btnElement) {
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const data = gameData[yearId];

      let photoHTML = '';
      data.photos.forEach(img => {
        photoHTML += `
          <div class="p5-photo">
            <img src="${img.src}" alt="${img.cap}">
            <p>${img.cap}</p>
          </div>
        `;
      });

      const display = document.getElementById('card-display');
      display.style.animation = 'none';
      display.offsetHeight;
      display.style.animation = null; 

      display.innerHTML = `
        <div class="card-header">
          <h2>CONFIDANT RANK: ${data.rank}</h2>
          <div class="rank-stars">${data.stars}</div>
        </div>
        
        <div class="inner-content">
          <button class="play-btn" onclick="toggleAudio('${data.song}', this)">▶ Play BGM</button>
          <p style="font-weight: 900; font-size: 1.1rem; margin-top:0;">${data.title}</p>
          <p>${data.desc}</p>
          
          <div class="p5-gallery">
            ${photoHTML}
          </div>
        </div>
        
        <div class="corner-flair">MEMORIES</div>
      `;
    }

    function toggleAudio(audioId, btnElement) {
      const track = document.getElementById(audioId);
      if (!track) return;

      if (currentAudio && currentAudio !== track) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      if (track.paused) {
        track.play();
        btnElement.innerText = "⏸ PAUSE BGM";
        currentAudio = track;
      } else {
        track.pause();
        btnElement.innerText = "▶ PLAY BGM";
      }
    }
  </script>
</body>
</html>
