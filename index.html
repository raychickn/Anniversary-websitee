<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zozo & Raychickn | ReMind</title>
  <!-- KH Style Geometric/Futuristic Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- KH3 REMIND EXACT COLOR PALETTE --- */
    :root {
      --kh-bg: #f4f8fc;
      --kh-text-dark: #122236;
      --kh-text-blue: #2a52be;
      --kh-accent-cyan: #00d2ff;
      --kh-active-glow: #61c5ff;
      --kh-line: #cde0f2;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: #f4f8fc;
      /* Soft bright sky gradient matching KH3 ReMind */
      background: linear-gradient(180deg, #ffffff 0%, #e6f2ff 60%, #b3dbff 100%);
      color: var(--kh-text-dark);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* --- LAYOUT GRID --- */
    .title-screen {
      width: 92vw;
      height: 88vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* --- TOP LOGO AREA --- */
    .logo-container {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    .sub-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #668099;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .main-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--kh-text-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
    }

    .main-logo span {
      color: var(--kh-text-blue);
      font-style: italic;
    }

    /* --- LEFT MENU PANEL --- */
    .menu-panel {
      flex: 0 0 280px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      margin-top: 60px;
    }

    .menu-item {
      background: none;
      border: none;
      border-bottom: 1px solid var(--kh-line);
      color: var(--kh-text-dark);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      width: 100%;
    }

    .menu-item:hover {
      color: var(--kh-text-blue);
      padding-left: 26px;
    }

    /* KH3 Active Selection Glow Bar */
    .menu-item.active {
      color: #ffffff !important;
      background: linear-gradient(90deg, #3aa8f7 0%, #72d6ff 100%);
      box-shadow: 0 4px 15px rgba(58, 168, 247, 0.4);
      border-radius: 4px;
      border-bottom: none;
      padding-left: 22px;
    }

    /* Glowing Crown Bullet on Selection */
    .menu-item.active::before {
      content: '✦';
      position: absolute;
      left: 8px;
      color: #ffffff;
      font-size: 0.9rem;
    }

    /* --- CENTRAL CONTENT PANEL --- */
    .content-panel {
      flex: 1;
      max-width: 52%;
      height: 75vh;
      margin-left: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .active-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 2px solid #ffffff;
      padding: 25px;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(18, 34, 54, 0.08);
      overflow-y: auto;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: var(--kh-text-blue);
      letter-spacing: 2px;
      margin-top: 0;
      border-bottom: 2px solid var(--kh-line);
      padding-bottom: 8px;
    }

    .kh-body {
      font-size: 1.1rem;
      color: var(--kh-text-dark);
      font-weight: 600;
      line-height: 1.5;
    }

    /* --- GALLERY GRID --- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .gallery-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1px solid var(--kh-line);
      text-align: center;
    }

    .gallery-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
    }

    .gallery-card p {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--kh-text-dark);
      margin: 4px 0 0 0;
    }

    /* --- BOTTOM HELP BANNER (Like the screenshot) --- */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, rgba(58,168,247,0.85) 0%, rgba(114,214,255,0.85) 100%);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      padding: 6px 15px;
      display: flex;
      justify-content: space-between;
      border-radius: 4px;
    }

    /* --- AUDIO BUTTON --- */
    .music-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #ffffff;
      border: 2px solid var(--kh-text-blue);
      color: var(--kh-text-blue);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- BGM SOUNDTRACK -->
  <audio id="khBgm" loop src="kh_bgm.mp3"></audio>

  <button class="music-btn" onclick="toggleMusic()" id="musicBtn">▶ MUSIC</button>

  <div class="title-screen">

    <!-- TOP LOGO -->
    <div class="logo-container">
      <div class="sub-brand">DISNEY x SQUARE ENIX</div>
      <div class="main-logo">KINGDOM HEARTS <span>ReMind</span></div>
    </div>

    <!-- LEFT MENU PANEL -->
    <div class="menu-panel">
      <button class="menu-item active" onclick="switchSection('welcome')">START</button>
      <button class="menu-item" onclick="switchSection('journey')">JOURNEY</button>
      <button class="menu-item" onclick="switchSection('gallery')">MEMORIES</button>
      <button class="menu-item" onclick="switchSection('letters')">LETTERS</button>
      <button class="menu-item" onclick="switchSection('quiz')">CHALLENGE</button>
      <button class="menu-item" onclick="switchSection('credits')">CREDITS</button>
    </div>

    <!-- CENTRAL CONTENT CARD -->
    <div class="content-panel" id="contentDiv">
      <div class="active-card">
        <h2 class="card-header">ZOZO & RAYCHICKN II</h2>
        <p class="kh-body">Happy 5th Anniversary, Zozo! ❤️</p>
        <p class="kh-body">Welcome to our custom ReMind menu. Select any section on the left to explore our memories, timeline, and letters!</p>
      </div>
    </div>

    <!-- BOTTOM HELP BAR -->
    <div class="bottom-bar">
      <span>Select data to load...</span>
      <span>Ver. 5.0 (2021 - 2026)</span>
    </div>

  </div>

  <script>
    function switchSection(sectionId) {
      const contentDiv = document.getElementById('contentDiv');
      const menuItems = document.querySelectorAll('.menu-item');

      // Update Active Button
      menuItems.forEach(item => item.classList.remove('active'));
      const clickedBtn = document.querySelector(`.menu-item[onclick*='${sectionId}']`);
      if (clickedBtn) clickedBtn.classList.add('active');

      // Update Card Content
      let newHtml = '';

      if (sectionId === 'welcome') {
        newHtml = `
          <div class="active-card">
            <h2 class="card-header">ZOZO & RAYCHICKN II</h2>
            <p class="kh-body">Happy 5th Anniversary, Zozo! ❤️</p>
            <p class="kh-body">Welcome to our custom ReMind menu. Select any section on the left to explore our memories, timeline, and letters!</p>
          </div>`;
      } else if (sectionId === 'journey') {
        newHtml = `
          <div class="active-card">
            <h2 class="card-header">OUR JOURNEY</h2>
            <p class="kh-body"><b>Year 1 (2021-2022):</b> Where it all started!</p>
            <p class="kh-body"><b>Year 2 (2022-2023):</b> Making memories and growing closer.</p>
            <p class="kh-body"><b>Year 3 (2023-2024):</b> Building our little routines.</p>
            <p class="kh-body"><b>Year 4 (2024-2025):</b> Road trips & endless laughs.</p>
            <p class="kh-body"><b>Year 5 (2025-2026):</b> Celebrating half a decade together!</p>
          </div>`;
      } else if (sectionId === 'gallery') {
        newHtml = `
          <div class="active-card">
            <h2 class="card-header">MEMORY CACHE</h2>
            <div class="gallery-grid">
              <div class="gallery-card"><img src="IMG_9733.jpeg"><p>Our First Drink 🍹</p></div>
              <div class="gallery-card"><img src="IMG_5759.jpeg"><p>Goth x Dreadhead 🖤</p></div>
              <div class="gallery-card"><img src="IMG_5218.jpeg"><p>Our First Holiday ✈️</p></div>
              <div class="gallery-card"><img src="IMG_2467.jpeg"><p>First Time Over 🏠</p></div>
              <div class="gallery-card"><img src="DSC_0071 2.jpeg"><p>Prom King & Queen 👑</p></div>
              <div class="gallery-card"><img src="IMG_1850 2.jpeg"><p>Halloween 🎃</p></div>
            </div>
          </div>`;
      } else if (sectionId === 'letters') {
        newHtml = `
          <div class="active-card">
            <h2 class="card-header">OPEN WHEN LETTERS</h2>
            <p class="kh-body"><b>✉️ Open When You Miss Me:</b> [Add your letter text here]</p>
            <p class="kh-body"><b>✉️ Open On Our Anniversary:</b> [Add your letter text here]</p>
          </div>`;
      } else if (sectionId === 'quiz') {
        newHtml = `
          <div class="active-card">
            <h2 class="card-header">THE CHALLENGE</h2>
            <p class="kh-body">How well do you know our 5 years together?</p>
            <p class="kh-body"><b>Q1: Where was our first official date?</b></p>
          </div>`;
      } else if (sectionId === 'credits') {
        newHtml = `
          <div class="active-card">
            <h2 class="card-header">SPECIAL THANKS</h2>
            <p class="kh-body"><b>Created By:</b> Raychickn</p>
            <p class="kh-body"><b>For:</b> Zozo</p>
            <p class="kh-body">Thank you for 5 amazing years. Here is to many more chapters together!</p>
          </div>`;
      }

      contentDiv.innerHTML = newHtml;
    }

    function toggleMusic() {
      const music = document.getElementById("khBgm");
      const btn = document.getElementById("musicBtn");
      if (music.paused) {
        music.play();
        btn.innerText = "⏸ PAUSE";
        btn.style.background = "#2a52be";
        btn.style.color = "#ffffff";
      } else {
        music.pause();
        btn.innerText = "▶ MUSIC";
        btn.style.background = "#ffffff";
        btn.style.color = "#2a52be";
      }
    }
  </script>
</body>
</html>
